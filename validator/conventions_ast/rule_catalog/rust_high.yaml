  - id: rust.no_panic
    title: No panic in production Rust paths
    language: rust
    domain: code
    decision_kind: executable
    decidability: ast
    precision: high
    severity: error
    enforcement: mode
    source_path: ai-ressources/code-conventions/rust.md
    source_anchor: "#error-handling"
    source_hash: sha256:868f663dde00b42671fa478c470ca00b61b1cc11e200c54fe01a12bf89b34d88
    backend: ast-grep
    detector: rust.no_panic
    patterns:
      - kind: sg_yaml
        value: |
          id: rust.no_panic
          language: Rust
          rule:
            pattern: panic!($$$ARGS)

name: LiveSpec Validator Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  NODE_VERSION: '26.3.0'
  PLAYWRIGHT_INSTALL_NODE_VERSION: '20.20.2'

jobs:
  unit-tests:
    name: "Unit Tests (Layers 1-4)"
    runs-on: ubuntu-latest
    env:
      AIRESOURCES: ${{ github.workspace }}/.ci-deps/ai-ressources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: 'false'
      - name: Install locked toolchain and dependencies
        # Install the exact versions from uv.lock so ruff/mypy/pytest match local runs.
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev --extra integration -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --system -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --system --no-deps -e .
      # Public Penflow (MIT): commit-map equivalent of retired private revision dcbfea6.
      - name: Checkout pinned Penflow CLI
        uses: actions/checkout@v4
        with:
          repository: julien-m/penflow
          ref: dd356b95f8543d025b85632ce3998eed88fef07c
          persist-credentials: false
          path: .ci-deps/penflow
      - name: Install pinned Penflow CLI
        run: uv pip install --no-cache --system ./.ci-deps/penflow
      - name: Remove Penflow dependency checkout
        if: always()
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          checkout = Path(".ci-deps/penflow")
          if checkout.exists():
              shutil.rmtree(checkout)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Node 26 stalls after the browser download; Node 20 completes installation.
      - name: Use Node for browser installation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PLAYWRIGHT_INSTALL_NODE_VERSION }}
      - run: npx playwright install --with-deps chromium
      - name: Restore test and generation runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Ubuntu's sg can mean group switching; install and identify the real AST detector.
      - name: Install pinned AST backend
        run: npm install --global @ast-grep/cli@0.44.0
      - name: Verify AST backend identity
        run: test "$(sg --version)" = "ast-grep 0.44.0"
      # AST catalog provenance requires private documents at this exact revision.
      - name: Require read-only normative corpus capability
        env:
          AIRESOURCES_KEY: ${{ secrets.AIRESOURCES_READONLY_DEPLOY_KEY }}
        run: |
          if [ -z "$AIRESOURCES_KEY" ]; then
            echo "AST tests require AIRESOURCES_READONLY_DEPLOY_KEY for the pinned private corpus." >&2
            exit 1
          fi
      - name: Checkout pinned normative corpus
        uses: actions/checkout@v4
        with:
          repository: julien-m/ai-ressources
          ref: 11976242fc5b9ae5f3a574e19339b78ebd18a0c4
          ssh-key: ${{ secrets.AIRESOURCES_READONLY_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci-deps/ai-ressources
          sparse-checkout: |
            /code-conventions/general.md
            /code-conventions/python.md
            /code-conventions/javascript.md
            /code-conventions/cli.md
            /code-conventions/stack-commands.md
            /code-conventions/rust.md
            /code-conventions/swift-kotlin.md
          sparse-checkout-cone-mode: false
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright validator
      - run: mypy .
      - run: pytest tests/ --ignore=tests/integration -v --tb=short
      - run: >
          pytest tests/test_visual_gate.py
          tests/test_visual_gate_receipts.py
          tests/test_visual_implementation_gate.py
          --cov=validator.visual_gate
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=94

      # Keep source provenance available through all consumers, then remove private bytes.
      - name: Remove private normative corpus
        if: always()
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          corpus = Path(".ci-deps/ai-ressources")
          if corpus.exists():
              shutil.rmtree(corpus)
          PYTHON

  vitest-observer:
    name: "Vitest observer (Node 22 / Vitest 2.1.9)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: 'false'
      - name: Install locked Python observer test dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev --extra integration -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --system -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --system --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install locked observer fixture toolchain
        run: timeout 120s npm ci --prefix tests/fixtures/vitest_toolchain --no-audit --no-fund
      - name: Bind and require the supported local runtime
        run: |
          echo "LIVESPEC_VITEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "LIVESPEC_VITEST_NODE_MODULES=$GITHUB_WORKSPACE/tests/fixtures/vitest_toolchain/node_modules" >> "$GITHUB_ENV"
          node --input-type=module -e 'import assert from "node:assert/strict"; import { readFileSync } from "node:fs"; assert.match(process.version, /^v22\./); assert.equal(JSON.parse(readFileSync("tests/fixtures/vitest_toolchain/node_modules/vitest/package.json", "utf8")).version, "2.1.9");'
      - name: Check owned observer TypeScript and style
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path.cwd()
          modules = Path(os.environ["LIVESPEC_VITEST_NODE_MODULES"])
          entries = {
              "vitest": "vitest/dist/index.d.ts",
              "vitest/config": "vitest/dist/config.d.ts",
              "vitest/runners": "vitest/dist/runners.d.ts",
              "vitest/reporters": "vitest/dist/reporters.d.ts",
              "@vitest/runner": "@vitest/runner/dist/index.d.ts",
              "vite": "vite/dist/node/index.d.ts",
          }
          config = {
              "compilerOptions": {
                  "strict": True, "target": "ES2022", "module": "ESNext",
                  "moduleResolution": "Bundler", "skipLibCheck": True, "noEmit": True,
                  "types": ["node"], "typeRoots": [str(modules / "@types")],
                  "baseUrl": str(root),
                  "paths": {name: [str(modules / entry)] for name, entry in entries.items()},
              },
              "include": [str(root / "validator/vitest/*.ts")],
          }
          (Path(os.environ["RUNNER_TEMP"]) / "vitest-tsconfig.json").write_text(json.dumps(config))
          PYTHON
          timeout 60s "$LIVESPEC_VITEST_NODE_MODULES/.bin/tsc" --project "$RUNNER_TEMP/vitest-tsconfig.json"
          timeout 60s "$LIVESPEC_VITEST_NODE_MODULES/.bin/biome" check validator/vitest
      - name: Run real observer tests and reject skipped coverage
        run: |
          timeout 300s pytest tests/test_execution_vitest.py tests/test_execution_vitest_boundaries.py tests/test_execution_vitest_integrity.py tests/test_execution_vitest_budgets.py tests/test_execution_vitest_goal.py -q --junitxml="$RUNNER_TEMP/vitest-observer.xml"
          python - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "vitest-observer.xml")
          cases = report.findall(".//testcase")
          assert cases, "Observer suite collected no tests"
          assert not report.findall(".//skipped"), "Observer suite must execute every real test"
          PYTHON

  integration-3a:
    name: "Integration 3A — Static invariants (no LLM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: 'false'
      - name: Install locked toolchain and dependencies
        # Install the exact versions from uv.lock so ruff/mypy/pytest match local runs.
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev --extra integration -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --system -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --system --no-deps -e .
      # Public Penflow (MIT): commit-map equivalent of retired private revision dcbfea6.
      - name: Checkout pinned Penflow CLI
        uses: actions/checkout@v4
        with:
          repository: julien-m/penflow
          ref: dd356b95f8543d025b85632ce3998eed88fef07c
          persist-credentials: false
          path: .ci-deps/penflow
      - name: Install pinned Penflow CLI
        run: uv pip install --no-cache --system ./.ci-deps/penflow
      - name: Remove Penflow dependency checkout
        if: always()
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          checkout = Path(".ci-deps/penflow")
          if checkout.exists():
              shutil.rmtree(checkout)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Node 26 stalls after the browser download; Node 20 completes installation.
      - name: Use Node for browser installation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PLAYWRIGHT_INSTALL_NODE_VERSION }}
      - run: npx playwright install --with-deps chromium
      - name: Restore test and generation runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pytest tests/integration/ -m level_3a -v --tb=short

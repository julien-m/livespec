name: LiveSpec Validator Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  NODE_VERSION: '26.3.0'
  PLAYWRIGHT_INSTALL_NODE_VERSION: '20.20.2'

jobs:
  unit-tests:
    name: "Unit Tests (Layers 1-4)"
    runs-on: ubuntu-latest
    env:
      AIRESOURCES: ${{ github.workspace }}/.ci-deps/ai-ressources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: 'false'
      - run: uv pip install --system -e ".[dev,integration]"
      - name: Require read-only Penflow capability
        env:
          PENFLOW_KEY: ${{ secrets.PENFLOW_READONLY_DEPLOY_KEY }}
        run: |
          if [ -z "$PENFLOW_KEY" ]; then
            echo "Penflow CLI checks require PENFLOW_READONLY_DEPLOY_KEY for the pinned private dependency." >&2
            exit 1
          fi
      - name: Checkout pinned Penflow CLI
        uses: actions/checkout@v4
        with:
          repository: julien-m/penflow
          ref: dcbfea6e2e6e6b359b1b0d80607670a4eb7ad6b7
          ssh-key: ${{ secrets.PENFLOW_READONLY_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci-deps/penflow
      - name: Install pinned Penflow CLI
        run: uv pip install --no-cache --system ./.ci-deps/penflow
      - name: Remove private dependency checkout
        if: always()
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          checkout = Path(".ci-deps/penflow")
          if checkout.exists():
              shutil.rmtree(checkout)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Node 26 stalls after the browser download; Node 20 completes installation.
      - name: Use Node for browser installation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PLAYWRIGHT_INSTALL_NODE_VERSION }}
      - run: npx playwright install --with-deps chromium
      - name: Restore test and generation runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Ubuntu's sg can mean group switching; install and identify the real AST detector.
      - name: Install pinned AST backend
        run: npm install --global @ast-grep/cli@0.44.0
      - name: Verify AST backend identity
        run: test "$(sg --version)" = "ast-grep 0.44.0"
      # AST catalog provenance requires private documents at this exact revision.
      - name: Require read-only normative corpus capability
        env:
          AIRESOURCES_KEY: ${{ secrets.AIRESOURCES_READONLY_DEPLOY_KEY }}
        run: |
          if [ -z "$AIRESOURCES_KEY" ]; then
            echo "AST tests require AIRESOURCES_READONLY_DEPLOY_KEY for the pinned private corpus." >&2
            exit 1
          fi
      - name: Checkout pinned normative corpus
        uses: actions/checkout@v4
        with:
          repository: julien-m/ai-ressources
          ref: 11976242fc5b9ae5f3a574e19339b78ebd18a0c4
          ssh-key: ${{ secrets.AIRESOURCES_READONLY_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci-deps/ai-ressources
          sparse-checkout: |
            /code-conventions/javascript.md
            /code-conventions/rust.md
            /code-conventions/swift-kotlin.md
          sparse-checkout-cone-mode: false
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright validator
      - run: mypy .
      - run: pytest tests/ --ignore=tests/integration -v --tb=short
      - run: >
          pytest tests/test_visual_gate.py
          tests/test_visual_gate_receipts.py
          tests/test_visual_implementation_gate.py
          --cov=validator.visual_gate
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=94

      # Keep source provenance available through all consumers, then remove private bytes.
      - name: Remove private normative corpus
        if: always()
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          corpus = Path(".ci-deps/ai-ressources")
          if corpus.exists():
              shutil.rmtree(corpus)
          PYTHON

  integration-3a:
    name: "Integration 3A — Static invariants (no LLM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: 'false'
      - run: uv pip install --system -e ".[dev]" pyyaml jsonschema anyio
      - name: Require read-only Penflow capability
        env:
          PENFLOW_KEY: ${{ secrets.PENFLOW_READONLY_DEPLOY_KEY }}
        run: |
          if [ -z "$PENFLOW_KEY" ]; then
            echo "Penflow CLI checks require PENFLOW_READONLY_DEPLOY_KEY for the pinned private dependency." >&2
            exit 1
          fi
      - name: Checkout pinned Penflow CLI
        uses: actions/checkout@v4
        with:
          repository: julien-m/penflow
          ref: dcbfea6e2e6e6b359b1b0d80607670a4eb7ad6b7
          ssh-key: ${{ secrets.PENFLOW_READONLY_DEPLOY_KEY }}
          persist-credentials: false
          path: .ci-deps/penflow
      - name: Install pinned Penflow CLI
        run: uv pip install --no-cache --system ./.ci-deps/penflow
      - name: Remove private dependency checkout
        if: always()
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path
          checkout = Path(".ci-deps/penflow")
          if checkout.exists():
              shutil.rmtree(checkout)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Node 26 stalls after the browser download; Node 20 completes installation.
      - name: Use Node for browser installation
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PLAYWRIGHT_INSTALL_NODE_VERSION }}
      - run: npx playwright install --with-deps chromium
      - name: Restore test and generation runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pytest tests/integration/ -m level_3a -v --tb=short

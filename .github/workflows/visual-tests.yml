name: Visual Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5 critical combinations (EC-013: avoids full 9-job matrix by default)
        # Expand to all 9 by adding: mobile-firefox, mobile-webkit, tablet-firefox, tablet-webkit
        project:
          - mobile-chromium
          - tablet-chromium
          - desktop-chromium
          - desktop-firefox
          - desktop-webkit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          # EC-005 / EC-015: Install browser with system dependencies to avoid font issues in CI
          if [[ "${{ matrix.project }}" == "desktop-firefox" ]]; then
            npx playwright install --with-deps firefox
          elif [[ "${{ matrix.project }}" == "desktop-webkit" ]]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run visual tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # EC-014: test-results/ excluded from git via .gitignore
          name: visual-diff-${{ matrix.project }}
          path: test-results/
          retention-days: 30

      - name: Post PR diff comment
        if: failure() && github.event_name == 'pull_request'
        run: node scripts/visual-diff-pr-comment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ matrix.project }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

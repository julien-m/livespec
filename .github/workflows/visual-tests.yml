# LiveSpec traceability anchors
# @spec(AC-017)
# @spec(FR-017)

name: Visual Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-chromium
          - tablet-chromium
          - desktop-chromium
          - desktop-firefox
          - desktop-webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test tests/feature-010/ --project=${{ matrix.project }}

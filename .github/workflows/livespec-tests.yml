name: LiveSpec Integration Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      level:
        description: 'Test level (3A / 3B / 3C)'
        required: true
        default: '3B'

jobs:
  unit-tests:
    name: "Unit Tests (Layer 1 + 2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --ignore=tests/integration -v --tb=short

  tests-3a:
    name: "3A — Static invariants (no LLM)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]" && pip install -r tests/requirements-test.txt
      - run: pytest tests/integration/ -m level_3a -v --tb=short
        env:
          LIVESPEC_TEST_LEVEL: "3A"

  tests-3b:
    name: "3B — Isolated commands (LLM)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.level != '3A')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]" && pip install -r tests/requirements-test.txt
      - run: pytest tests/integration/ -m "level_3b and not chaos" -v --tb=short --timeout=180
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVESPEC_TEST_BUDGET_USD: "20"
          LIVESPEC_TEST_LEVEL: "3B"
      - name: Upload cost report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-report-${{ github.run_id }}
          path: tests/.cost-report.json

  tests-3c:
    name: "3C — Full pipeline (release gate)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.level == '3C'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]" && pip install -r tests/requirements-test.txt
      - run: pytest tests/integration/ -m level_3c -v --tb=long --timeout=300
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVESPEC_TEST_BUDGET_USD: "80"
          LIVESPEC_TEST_LEVEL: "3C"

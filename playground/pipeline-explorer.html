<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveSpec Pipeline Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e1e4ea;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #161822;
    border-bottom: 1px solid #262a3a;
    flex-shrink: 0;
  }

  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    color: #c4b5fd;
    white-space: nowrap;
  }

  .view-tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .view-tab {
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: #8b8fa7;
    border: 1px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .view-tab:hover { color: #c4b5fd; background: #1e2035; }
  .view-tab.active { color: #c4b5fd; background: #1e2035; border-color: #4338ca; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: #161822;
    border-right: 1px solid #262a3a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 12px 14px;
    border-bottom: 1px solid #262a3a;
  }

  .sidebar-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6b6f8a;
    margin-bottom: 8px;
  }

  .detail-panel {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }

  .detail-panel::-webkit-scrollbar { width: 5px; }
  .detail-panel::-webkit-scrollbar-track { background: transparent; }
  .detail-panel::-webkit-scrollbar-thumb { background: #2a2e42; border-radius: 3px; }

  .detail-title {
    font-size: 16px;
    font-weight: 700;
    color: #c4b5fd;
    margin-bottom: 4px;
  }

  .detail-subtitle {
    font-size: 12px;
    color: #6b6f8a;
    margin-bottom: 12px;
  }

  .detail-body {
    font-size: 13px;
    line-height: 1.6;
    color: #b0b4cc;
  }

  .detail-body h4 {
    font-size: 12px;
    font-weight: 600;
    color: #e1e4ea;
    margin: 12px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .detail-body ul {
    padding-left: 16px;
    margin: 4px 0;
  }

  .detail-body li {
    margin: 2px 0;
  }

  .detail-body code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    background: #1e2035;
    padding: 1px 5px;
    border-radius: 3px;
    color: #a5b4fc;
  }

  .detail-body .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    margin: 1px 2px;
  }

  .tag-agent { background: #1e3a5f; color: #60a5fa; }
  .tag-artifact { background: #3b1f4e; color: #c084fc; }
  .tag-command { background: #1a3330; color: #34d399; }
  .tag-superpowers { background: #4a2000; color: #fb923c; }

  /* Comments section */
  .comments-section {
    border-top: 1px solid #262a3a;
    max-height: 240px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .comments-section::-webkit-scrollbar { width: 5px; }
  .comments-section::-webkit-scrollbar-thumb { background: #2a2e42; border-radius: 3px; }

  .comments-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px 6px;
    position: sticky;
    top: 0;
    background: #161822;
    z-index: 1;
  }

  .comments-header h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6b6f8a;
  }

  .comment-count {
    font-size: 10px;
    background: #4338ca;
    color: white;
    padding: 1px 6px;
    border-radius: 10px;
  }

  .comment-item {
    padding: 8px 14px;
    border-bottom: 1px solid #1e2035;
    font-size: 12px;
  }

  .comment-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }

  .comment-item-target {
    font-weight: 600;
    color: #c4b5fd;
    font-size: 11px;
  }

  .comment-delete {
    cursor: pointer;
    color: #ef4444;
    font-size: 14px;
    opacity: 0.5;
    transition: opacity 0.15s;
    background: none;
    border: none;
    padding: 0 2px;
  }

  .comment-delete:hover { opacity: 1; }

  .comment-item-text {
    color: #8b8fa7;
    line-height: 1.4;
  }

  /* Canvas area */
  .canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .svg-container {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }

  .svg-container:active { cursor: grabbing; }

  .svg-container svg {
    width: 100%;
    height: 100%;
  }

  /* Zoom controls */
  .zoom-controls {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    gap: 4px;
  }

  .zoom-btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #1e2035;
    border: 1px solid #2a2e42;
    color: #8b8fa7;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .zoom-btn:hover { background: #262a3a; color: #c4b5fd; }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: #161822ee;
    border: 1px solid #262a3a;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #8b8fa7;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  .legend-line {
    width: 20px;
    height: 2px;
  }

  /* Prompt output */
  .prompt-bar {
    background: #161822;
    border-top: 1px solid #262a3a;
    padding: 10px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    flex-shrink: 0;
    max-height: 120px;
  }

  .prompt-text {
    flex: 1;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    color: #8b8fa7;
    line-height: 1.5;
    max-height: 100px;
    overflow-y: auto;
    white-space: pre-wrap;
  }

  .prompt-text::-webkit-scrollbar { width: 4px; }
  .prompt-text::-webkit-scrollbar-thumb { background: #2a2e42; border-radius: 2px; }

  .copy-btn {
    padding: 6px 14px;
    border-radius: 6px;
    background: #4338ca;
    color: white;
    border: none;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .copy-btn:hover { background: #5145e5; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e2035;
    border: 1px solid #2a2e42;
    border-radius: 12px;
    padding: 20px;
    width: 420px;
    max-width: 90vw;
  }

  .modal h3 {
    font-size: 15px;
    color: #c4b5fd;
    margin-bottom: 4px;
  }

  .modal .modal-sub {
    font-size: 12px;
    color: #6b6f8a;
    margin-bottom: 12px;
  }

  .modal textarea {
    width: 100%;
    height: 80px;
    background: #0f1117;
    border: 1px solid #2a2e42;
    border-radius: 8px;
    color: #e1e4ea;
    font-size: 13px;
    padding: 10px;
    resize: vertical;
    font-family: inherit;
  }

  .modal textarea:focus { outline: none; border-color: #4338ca; }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 12px;
  }

  .modal-btn {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }

  .modal-btn-cancel {
    background: transparent;
    color: #8b8fa7;
    border-color: #2a2e42;
  }

  .modal-btn-cancel:hover { background: #262a3a; }

  .modal-btn-save {
    background: #4338ca;
    color: white;
  }

  .modal-btn-save:hover { background: #5145e5; }

  /* Step counter badge on view */
  .view-desc {
    font-size: 11px;
    color: #6b6f8a;
    padding: 0 14px 8px;
  }

  /* Node tooltip */
  .node-tooltip {
    position: absolute;
    background: #1e2035;
    border: 1px solid #4338ca;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    color: #b0b4cc;
    pointer-events: none;
    z-index: 50;
    max-width: 250px;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  .empty-state {
    color: #4a4e6a;
    font-size: 13px;
    text-align: center;
    padding: 24px 14px;
    line-height: 1.6;
  }

  .phase-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    margin-right: 4px;
  }

  .checklist { list-style: none; padding-left: 0; }
  .checklist li::before { content: "[ ] "; font-family: monospace; color: #6b6f8a; }
  .checklist li.done::before { content: "[x] "; color: #34d399; }
</style>
</head>
<body>

<div class="topbar">
  <h1>LiveSpec Pipeline Explorer</h1>
  <div class="view-tabs" id="viewTabs"></div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="detail-panel" id="detailPanel">
      <div class="empty-state">
        Click on any node in the diagram to see its details.<br><br>
        Right-click a node to add a comment.
      </div>
    </div>
    <div class="comments-section" id="commentsSection">
      <div class="comments-header">
        <h3>Comments</h3>
        <span class="comment-count" id="commentCount">0</span>
      </div>
      <div id="commentsList"></div>
    </div>
  </div>

  <div class="canvas-area">
    <div class="svg-container" id="svgContainer">
      <svg id="mainSvg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
          <marker id="arrow-dispatch" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fb923c"/></marker>
          <marker id="arrow-agent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34d399"/></marker>
          <marker id="arrow-artifact" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a78bfa"/></marker>
          <marker id="arrow-review" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f87171"/></marker>
          <marker id="arrow-gate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/></marker>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
      </svg>
      <div class="node-tooltip" id="tooltip"></div>
      <div class="legend" id="legend"></div>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">&minus;</button>
        <button class="zoom-btn" onclick="zoomReset()" style="font-size:12px">R</button>
      </div>
    </div>
    <div class="prompt-bar">
      <div class="prompt-text" id="promptText">Select a view and add comments to generate a discussion prompt about the LiveSpec pipeline.</div>
      <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
    </div>
  </div>
</div>

<!-- Comment modal -->
<div class="modal-overlay" id="commentModal">
  <div class="modal">
    <h3 id="modalTitle">Add Comment</h3>
    <div class="modal-sub" id="modalSub"></div>
    <textarea id="modalText" placeholder="Your comment or question about this step..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="saveComment()">Save</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const state = {
  currentView: 'pipeline',
  selectedNode: null,
  comments: [],
  pan: { x: 0, y: 0 },
  zoom: 1,
  dragging: false,
  dragStart: { x: 0, y: 0 },
  modalTarget: null
};

// ═══════════════════════════════════════════
// VIEWS DEFINITION
// ═══════════════════════════════════════════
const VIEWS = {
  pipeline: {
    label: 'Full Pipeline',
    desc: 'The complete LiveSpec workflow from project init to living documentation',
    legend: [
      { type: 'dot', color: '#34d399', label: 'Command' },
      { type: 'dot', color: '#60a5fa', label: 'Artifact' },
      { type: 'line', color: '#3b82f6', label: 'Flow' },
      { type: 'line', color: '#a78bfa', label: 'Creates/Updates', dash: true },
    ]
  },
  feature: {
    label: 'Feature Pipeline',
    desc: '/spec.feature end-to-end: specify → review → plan → review → implement with gates',
    legend: [
      { type: 'dot', color: '#34d399', label: 'Phase' },
      { type: 'dot', color: '#f87171', label: 'Review' },
      { type: 'dot', color: '#fbbf24', label: 'Gate' },
      { type: 'dot', color: '#60a5fa', label: 'Artifact' },
      { type: 'line', color: '#3b82f6', label: 'Flow' },
      { type: 'line', color: '#f87171', label: 'Review loop', dash: true },
    ]
  },
  implement: {
    label: 'Implementation Engine',
    desc: 'Supervisor → SuperPowers → Subagents: the multi-agent orchestration',
    legend: [
      { type: 'dot', color: '#fb923c', label: 'SuperPowers' },
      { type: 'dot', color: '#34d399', label: 'Agent' },
      { type: 'dot', color: '#60a5fa', label: 'Artifact' },
      { type: 'line', color: '#fb923c', label: 'Dispatch' },
      { type: 'line', color: '#34d399', label: 'Agent call' },
      { type: 'line', color: '#f87171', label: 'Review loop', dash: true },
    ]
  },
  commands: {
    label: 'All Commands',
    desc: 'The 10 LiveSpec commands organized by function',
    legend: [
      { type: 'dot', color: '#34d399', label: 'Create' },
      { type: 'dot', color: '#60a5fa', label: 'Analyze' },
      { type: 'dot', color: '#fb923c', label: 'Execute' },
      { type: 'dot', color: '#c084fc', label: 'Evolve' },
      { type: 'line', color: '#3b82f6', label: 'Depends on' },
    ]
  },
  artifacts: {
    label: 'Artifact Map',
    desc: '.specs/ directory: what each command creates and updates',
    legend: [
      { type: 'dot', color: '#34d399', label: 'Command (writer)' },
      { type: 'dot', color: '#a78bfa', label: 'Artifact' },
      { type: 'line', color: '#34d399', label: 'Creates', dash: false },
      { type: 'line', color: '#fbbf24', label: 'Updates', dash: true },
    ]
  },
  agents: {
    label: 'Agent System',
    desc: 'The 4 LiveSpec agents and how they collaborate during implementation',
    legend: [
      { type: 'dot', color: '#34d399', label: 'LiveSpec Agent' },
      { type: 'dot', color: '#fb923c', label: 'SuperPowers Subagent' },
      { type: 'dot', color: '#60a5fa', label: 'Input/Output' },
      { type: 'line', color: '#3b82f6', label: 'Flow' },
      { type: 'line', color: '#fb923c', label: 'Dispatch' },
    ]
  }
};

// ═══════════════════════════════════════════
// NODE & EDGE DEFINITIONS PER VIEW
// ═══════════════════════════════════════════

function getViewData(viewId) {
  switch(viewId) {
    case 'pipeline': return getPipelineData();
    case 'feature': return getFeatureData();
    case 'implement': return getImplementData();
    case 'commands': return getCommandsData();
    case 'artifacts': return getArtifactsData();
    case 'agents': return getAgentsData();
  }
}

function getPipelineData() {
  const nodes = [
    { id: 'init', label: '/spec.init', subtitle: 'Project Initialization', x: 120, y: 60, w: 160, h: 52, color: '#064e3b', stroke: '#34d399', category: 'command',
      detail: {
        title: '/spec.init',
        subtitle: 'Phase A → B → C: Brainstorm → Stack Decisions → Installation',
        body: `<h4>What it does</h4>
<p>Initialize LiveSpec in a project through a <strong>3-phase conversational brainstorm</strong>.</p>
<h4>Phase A — Brainstorm</h4>
<ul>
<li>6 questions: What? Who? Where? Real-time? Geography? Budget?</li>
<li>Captures vision, users, roles, constraints</li>
</ul>
<h4>Phase B — Stack Decisions</h4>
<ul>
<li>AI-guided infrastructure decision tree</li>
<li>Creates <span class="tag tag-artifact">ADR</span> records (min 1)</li>
<li>Visual decision flowchart (Mermaid)</li>
</ul>
<h4>Phase C — Installation</h4>
<ul>
<li>Creates <code>.specs/</code> directory structure</li>
<li>Generates: spec-system.md, constitution.md, project.md, stacks/, testing/strategy.md</li>
</ul>
<h4>Flags</h4>
<p><code>--auto</code> <code>--stack [preset]</code> <code>--dir [path]</code> <code>--dry-run</code></p>` }},
    { id: 'propose', label: '/spec.propose', subtitle: 'Feature Suggestions', x: 120, y: 170, w: 160, h: 52, color: '#064e3b', stroke: '#34d399', category: 'command',
      detail: {
        title: '/spec.propose',
        subtitle: 'Read-only analysis — discover what to build next',
        body: `<h4>What it does</h4>
<p>Analyze project context and propose the <strong>next feature(s)</strong> to build.</p>
<h4>Gap Analysis (5 dimensions)</h4>
<ul>
<li><strong>Role Coverage</strong> — which user roles have no features?</li>
<li><strong>User Journey</strong> — which workflows are incomplete?</li>
<li><strong>Platform</strong> — missing on mobile/desktop?</li>
<li><strong>Dependency Closure</strong> — which features enable others?</li>
<li><strong>MVP Completeness</strong> — what's MVP-critical?</li>
</ul>
<h4>Output</h4>
<p>Ranked feature proposals with priority, impact, dependencies, estimated scope (S/M/L)</p>
<h4>Flags</h4>
<p><code>--count N</code> <code>--role [name]</code> <code>--mvp</code> <code>--auto</code></p>` }},
    { id: 'specify', label: '/spec.specify', subtitle: 'Create Feature Spec', x: 120, y: 280, w: 160, h: 52, color: '#064e3b', stroke: '#34d399', category: 'command',
      detail: {
        title: '/spec.specify',
        subtitle: 'User stories + Mermaid flowcharts + AC + FR',
        body: `<h4>What it does</h4>
<p>Create a complete feature specification with user stories, <strong>mandatory Mermaid flowcharts</strong>, acceptance criteria, and functional requirements.</p>
<h4>Generated Content</h4>
<ul>
<li><strong>User Stories</strong> — prioritized P1/P2/P3 with Given/When/Then</li>
<li><strong>Mermaid flowchart</strong> per story (MANDATORY)</li>
<li><strong>Acceptance Criteria</strong> — AC-001...AC-NNN</li>
<li><strong>Functional Requirements</strong> — FR-001...FR-NNN (each maps to ≥1 AC)</li>
<li><strong>Key Entities, Edge Cases, Success Criteria</strong></li>
<li><strong>Infrastructure Requirements</strong> (if external resources)</li>
</ul>
<h4>Quality Gates</h4>
<ul>
<li>Every story has Mermaid flowchart</li>
<li>All AC in Given/When/Then</li>
<li>All FR reference ≥1 AC</li>
<li>≤3 [NEEDS CLARIFICATION] markers</li>
</ul>
<h4>Creates</h4>
<p><code>.specs/features/NNN-name/spec.md</code> + <code>changelog.md</code></p>` }},
    { id: 'plan', label: '/spec.plan', subtitle: 'Technical Planning', x: 120, y: 390, w: 160, h: 52, color: '#064e3b', stroke: '#34d399', category: 'command',
      detail: {
        title: '/spec.plan',
        subtitle: 'Sequence + State + ER diagrams → file-by-file implementation plan',
        body: `<h4>What it does</h4>
<p>Generate a technical plan with <strong>Mermaid diagrams</strong> and a step-by-step file-by-file implementation plan.</p>
<h4>Mermaid Diagrams</h4>
<ul>
<li><strong>Sequence diagram</strong> — MANDATORY if API/service interactions</li>
<li><strong>State diagram</strong> — MANDATORY if stateful entity</li>
<li><strong>ER diagram</strong> — MANDATORY if new tables</li>
</ul>
<h4>Plan Structure</h4>
<ul>
<li><strong>Step 0:</strong> Infrastructure provisioning (if applicable)</li>
<li><strong>Steps 1-6:</strong> Database → Data Access → Business Logic → API → UI → Tests</li>
<li>Each step: files to create/modify, functions, FR mappings</li>
</ul>
<h4>Also Includes</h4>
<ul>
<li>Constitution check (verify against architectural rules)</li>

// ═══════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════

function renderView() {
  const svg = document.getElementById('mainSvg');
  const data = getViewData(state.currentView);
  const { nodes, edges } = data;

  // Clear SVG (keep defs)
  const defs = svg.querySelector('defs');
  svg.innerHTML = '';
  svg.appendChild(defs);

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('id', 'viewGroup');
  svg.appendChild(g);

  // Draw edges first
  edges.forEach(edge => {
    const from = nodes.find(n => n.id === edge.from);
    const to = nodes.find(n => n.id === edge.to);
    if (!from || !to) return;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const { d, mx, my } = calcEdgePath(from, to);
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');

    const colors = { flow: '#3b82f6', dispatch: '#fb923c', agent: '#34d399', artifact: '#a78bfa', review: '#f87171', gate: '#fbbf24' };
    const color = colors[edge.type] || '#3b82f6';
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('marker-end', `url(#arrow-${edge.type})`);

    if (edge.type === 'artifact' || edge.type === 'review' || edge.type === 'gate') {
      path.setAttribute('stroke-dasharray', '6,3');
    }

    path.setAttribute('opacity', '0.6');
    g.appendChild(path);

    // Edge label
    if (edge.label) {
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', mx);
      text.setAttribute('y', my - 6);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', color);
      text.setAttribute('font-size', '9');
      text.setAttribute('opacity', '0.7');
      text.textContent = edge.label;
      g.appendChild(text);
    }
  });

  // Draw nodes
  nodes.forEach(node => {
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('class', 'node');
    group.setAttribute('data-id', node.id);
    group.style.cursor = 'pointer';

    const hasComment = state.comments.some(c => c.targetId === node.id);

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', node.x - node.w/2);
    rect.setAttribute('y', node.y - node.h/2);
    rect.setAttribute('width', node.w);
    rect.setAttribute('height', node.h);
    rect.setAttribute('rx', 8);
    rect.setAttribute('fill', node.color);
    rect.setAttribute('stroke', hasComment ? '#fbbf24' : node.stroke);
    rect.setAttribute('stroke-width', hasComment ? 2.5 : 1.5);
    if (state.selectedNode === node.id) {
      rect.setAttribute('filter', 'url(#glow)');
      rect.setAttribute('stroke-width', '2.5');
    }
    group.appendChild(rect);

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', node.x);
    label.setAttribute('y', node.subtitle ? node.y - 4 : node.y + 4);
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('fill', '#e1e4ea');
    label.setAttribute('font-size', '12');
    label.setAttribute('font-weight', '600');
    label.textContent = node.label;
    group.appendChild(label);

    if (node.subtitle) {
      const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      sub.setAttribute('x', node.x);
      sub.setAttribute('y', node.y + 12);
      sub.setAttribute('text-anchor', 'middle');
      sub.setAttribute('fill', '#6b6f8a');
      sub.setAttribute('font-size', '10');
      sub.textContent = node.subtitle;
      group.appendChild(sub);
    }

    // Comment indicator
    if (hasComment) {
      const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      badge.setAttribute('cx', node.x + node.w/2 - 6);
      badge.setAttribute('cy', node.y - node.h/2 + 6);
      badge.setAttribute('r', 6);
      badge.setAttribute('fill', '#fbbf24');
      group.appendChild(badge);

      const num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      num.setAttribute('x', node.x + node.w/2 - 6);
      num.setAttribute('y', node.y - node.h/2 + 10);
      num.setAttribute('text-anchor', 'middle');
      num.setAttribute('fill', '#0f1117');
      num.setAttribute('font-size', '9');
      num.setAttribute('font-weight', '700');
      num.textContent = state.comments.filter(c => c.targetId === node.id).length;
      group.appendChild(num);
    }

    // Events
    group.addEventListener('click', () => selectNode(node));
    group.addEventListener('contextmenu', (e) => { e.preventDefault(); openCommentModal(node); });
    group.addEventListener('mouseenter', (e) => showTooltip(e, node));
    group.addEventListener('mouseleave', hideTooltip);

    g.appendChild(group);
  });

  applyTransform();
  renderLegend();
  updatePrompt();
}

function calcEdgePath(from, to) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  // Find exit/entry points on node boundaries
  let fx = from.x, fy = from.y, tx = to.x, ty = to.y;

  // Simple: exit from closest edge
  const angle = Math.atan2(dy, dx);
  fx = from.x + Math.cos(angle) * Math.min(from.w/2, Math.abs(dx) > Math.abs(dy) ? from.w/2 : from.h/2);
  fy = from.y + Math.sin(angle) * Math.min(from.h/2, Math.abs(dy) > Math.abs(dx) ? from.h/2 : from.w/2);
  tx = to.x - Math.cos(angle) * Math.min(to.w/2, Math.abs(dx) > Math.abs(dy) ? to.w/2 : to.h/2);
  ty = to.y - Math.sin(angle) * Math.min(to.h/2, Math.abs(dy) > Math.abs(dx) ? to.h/2 : to.w/2);

  // Curved path
  const mx = (fx + tx) / 2;
  const my = (fy + ty) / 2;
  const cx = mx + (fy - ty) * 0.15;
  const cy = my + (tx - fx) * 0.15;

  return { d: `M${fx},${fy} Q${cx},${cy} ${tx},${ty}`, mx: (fx+tx)/2, my: (fy+ty)/2 };
}

function applyTransform() {
  const g = document.getElementById('viewGroup');
  if (g) {
    g.setAttribute('transform', `translate(${state.pan.x},${state.pan.y}) scale(${state.zoom})`);
  }
}

// ═══════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════

function selectNode(node) {
  state.selectedNode = node.id;
  renderDetail(node);
  renderView();
}

function renderDetail(node) {
  const panel = document.getElementById('detailPanel');
  if (!node.detail) {
    panel.innerHTML = '<div class="empty-state">No details available.</div>';
    return;
  }
  panel.innerHTML = `
    <div class="detail-title">${node.detail.title}</div>
    <div class="detail-subtitle">${node.detail.subtitle}</div>
    <div class="detail-body">${node.detail.body}</div>
    <div style="margin-top:14px">
      <button class="modal-btn modal-btn-save" onclick="openCommentModalById('${node.id}')" style="width:100%">
        Add Comment
      </button>
    </div>
  `;
}

function showTooltip(e, node) {
  const tooltip = document.getElementById('tooltip');
  tooltip.textContent = node.subtitle || node.label;
  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 12) + 'px';
  tooltip.style.top = (e.clientY - 30) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// ═══════════════════════════════════════════
// COMMENTS
// ═══════════════════════════════════════════

function openCommentModal(node) {
  state.modalTarget = node;
  document.getElementById('modalTitle').textContent = `Comment on: ${node.label}`;
  document.getElementById('modalSub').textContent = node.subtitle || '';
  document.getElementById('modalText').value = '';
  document.getElementById('commentModal').classList.add('open');
  setTimeout(() => document.getElementById('modalText').focus(), 50);
}

function openCommentModalById(id) {
  const data = getViewData(state.currentView);
  const node = data.nodes.find(n => n.id === id);
  if (node) openCommentModal(node);
}

function closeModal() {
  document.getElementById('commentModal').classList.remove('open');
  state.modalTarget = null;
}

function saveComment() {
  const text = document.getElementById('modalText').value.trim();
  if (!text || !state.modalTarget) return;

  state.comments.push({
    id: Date.now(),
    targetId: state.modalTarget.id,
    targetLabel: state.modalTarget.label,
    targetSubtitle: state.modalTarget.subtitle || '',
    text,
    view: state.currentView
  });

  closeModal();
  renderComments();
  renderView();
}

function deleteComment(id) {
  state.comments = state.comments.filter(c => c.id !== id);
  renderComments();
  renderView();
}

function renderComments() {
  const list = document.getElementById('commentsList');
  const count = document.getElementById('commentCount');
  count.textContent = state.comments.length;

  if (state.comments.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:12px 14px; font-size:11px;">Right-click a node or click "Add Comment" to discuss a step.</div>';
    return;
  }

  list.innerHTML = state.comments.map(c => `
    <div class="comment-item">
      <div class="comment-item-header">
        <span class="comment-item-target">${c.targetLabel}</span>
        <button class="comment-delete" onclick="deleteComment(${c.id})">×</button>
      </div>
      <div class="comment-item-text">${c.text}</div>
    </div>
  `).join('');

  updatePrompt();
}

// ═══════════════════════════════════════════
// PROMPT OUTPUT
// ═══════════════════════════════════════════

function updatePrompt() {
  const promptEl = document.getElementById('promptText');
  const view = VIEWS[state.currentView];

  if (state.comments.length === 0) {
    promptEl.textContent = `Currently viewing: ${view.label} — ${view.desc}\n\nAdd comments on specific nodes to generate a discussion prompt about the LiveSpec pipeline.`;
    return;
  }

  let parts = [`I'm reviewing the LiveSpec pipeline (${view.label} view).\n`];

  // Group comments by node
  const grouped = {};
  state.comments.forEach(c => {
    if (!grouped[c.targetLabel]) grouped[c.targetLabel] = [];
    grouped[c.targetLabel].push(c.text);
  });

  parts.push('Here are my comments and questions:\n');

  Object.entries(grouped).forEach(([label, texts]) => {
    parts.push(`**${label}:**`);
    texts.forEach(t => parts.push(`- ${t}`));
    parts.push('');
  });

  parts.push('Please address each comment. For optimizations, explain trade-offs. For questions, reference the relevant spec artifacts.');

  promptEl.textContent = parts.join('\n');
}

function copyPrompt() {
  const text = document.getElementById('promptText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
}

// ═══════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════

function renderLegend() {
  const legend = document.getElementById('legend');
  const view = VIEWS[state.currentView];
  legend.innerHTML = view.legend.map(item => {
    if (item.type === 'dot') {
      return `<div class="legend-item"><div class="legend-dot" style="background:${item.color}"></div>${item.label}</div>`;
    } else {
      const style = item.dash ? `background:repeating-linear-gradient(90deg,${item.color} 0,${item.color} 5px,transparent 5px,transparent 8px)` : `background:${item.color}`;
      return `<div class="legend-item"><div class="legend-line" style="${style}"></div>${item.label}</div>`;
    }
  }).join('');
}

// ═══════════════════════════════════════════
// VIEW TABS
// ═══════════════════════════════════════════

function initTabs() {
  const container = document.getElementById('viewTabs');
  Object.entries(VIEWS).forEach(([id, view]) => {
    const tab = document.createElement('button');
    tab.className = 'view-tab' + (id === state.currentView ? ' active' : '');
    tab.textContent = view.label;
    tab.onclick = () => switchView(id);
    container.appendChild(tab);
  });
}

function switchView(viewId) {
  state.currentView = viewId;
  state.selectedNode = null;
  state.pan = { x: 0, y: 0 };
  state.zoom = 1;

  // Update tabs
  document.querySelectorAll('.view-tab').forEach((tab, i) => {
    tab.className = 'view-tab' + (Object.keys(VIEWS)[i] === viewId ? ' active' : '');
  });

  // Reset detail panel
  document.getElementById('detailPanel').innerHTML = `
    <div class="view-desc" style="margin-bottom:8px; font-size:12px; color:#8b8fa7; line-height:1.5">${VIEWS[viewId].desc}</div>
    <div class="empty-state">Click on any node to see details.<br>Right-click to add a comment.</div>
  `;

  renderView();
}

// ═══════════════════════════════════════════
// PAN & ZOOM
// ═══════════════════════════════════════════

function zoomIn() { state.zoom = Math.min(3, state.zoom * 1.2); applyTransform(); }
function zoomOut() { state.zoom = Math.max(0.3, state.zoom / 1.2); applyTransform(); }
function zoomReset() { state.zoom = 1; state.pan = { x: 0, y: 0 }; applyTransform(); }

const svgContainer = document.getElementById('svgContainer');

svgContainer.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  state.dragging = true;
  state.dragStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
});

window.addEventListener('mousemove', (e) => {
  if (!state.dragging) return;
  state.pan.x = e.clientX - state.dragStart.x;
  state.pan.y = e.clientY - state.dragStart.y;
  applyTransform();
});

window.addEventListener('mouseup', () => { state.dragging = false; });

svgContainer.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  state.zoom = Math.max(0.3, Math.min(3, state.zoom * delta));
  applyTransform();
}, { passive: false });

// Handle Escape for modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.metaKey && document.getElementById('commentModal').classList.contains('open')) {
    saveComment();
  }
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
initTabs();
renderComments();
renderView();
</script>

[project]
name = "livespec-validator"
version = "0.1.0"
description = "Structural validator for LiveSpec .specs/ files"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "mistune>=3.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-tmp-files>=0.0.2",
]

[project.scripts]
livespec = "validator.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["validator*"]

[project]
name = "livespec-validator"
version = "0.1.0"
description = "Structural validator for LiveSpec .specs/ files"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "mistune>=3.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-tmp-files>=0.0.2",
]
integration = [
    "claude-agent-sdk>=0.1.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "jsonschema>=4.23",
]

[project.scripts]
livespec = "validator.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "level_3a: tests without LLM on static fixtures",
    "level_3b: tests with SDK isolated commands",
    "level_3c: tests full pipeline end-to-end",
    "chaos: tests on broken fixtures",
    "slow: tests > 30s",
    "android: tests requiring real Android SDK and AVD",
    "macos: tests requiring macOS + Xcode",
]

[tool.setuptools.packages.find]
include = ["validator*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

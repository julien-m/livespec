[project]
name = "livespec-validator"
version = "0.1.0"
description = "Structural validator for LiveSpec .specs/ files"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "mistune>=3.0",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # Imported directly by unit tests: typer no longer depends on click, and
    # jsonschema/pluggy must not arrive only transitively through other extras.
    "click>=8.1",
    "jsonschema>=4.23",
    "pluggy>=1.5",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-tmp-files>=0.0.2",
    "pyright>=1.1",
    "ruff>=0.7",
    "types-PyYAML>=6.0",
]
integration = [
    "claude-agent-sdk>=0.1.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "jsonschema>=4.23",
]

[project.scripts]
livespec = "validator.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: ordinary isolated tests (2 second managed limit)",
    "integration: local integration tests (10 second managed limit)",
    "acceptance: acceptance scenarios (30 second managed limit)",
    "level_3a: tests without LLM on static fixtures",
    "level_3b: tests with SDK isolated commands",
    "level_3c: tests full pipeline end-to-end",
    "chaos: tests on broken fixtures",
    "slow: tests > 30s",
    "android: tests requiring real Android SDK and AVD",
    "macos: tests requiring macOS + Xcode",
    "real_stop_condition: run the goal stop condition subprocess instead of the test stub",
]

[tool.setuptools.package-data]
validator = ["vitest/*.ts"]

[tool.setuptools.packages.find]
include = ["validator*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    # Local planning output is not ship source; keep real runtime/tests in Ruff scope.
    ".claude/output",
    # CI checks out external dependencies (ai-ressources, penflow) here; they are not LiveSpec source.
    ".ci-deps",
    # Detector payload fixtures are intentionally invalid snippets, not runtime Python modules.
    "tests/fixtures/conventions_ast/ars_rules",
    "tests/fixtures/conventions_ast/generated/python_code",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.mypy]
python_version = "3.12"
exclude = [
    "tests/fixtures/conventions_ast/ars_rules/",
    "tests/fixtures/conventions_ast/generated/python_code/",
]

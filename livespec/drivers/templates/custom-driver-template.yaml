# LiveSpec test driver — {stack}
# Generated by `livespec spec.driver --new {stack}`.
# Uncomment and fill in the capabilities you want to enable, then verify with
# `livespec spec.check`.
# Integration reference: .specs/spec-system.md (driver section).

name: {stack}

# === detect ===
# File globs (top-level only) used to identify the stack. Patterns are evaluated
# against the project root with Path.glob — they support "*" (segment) and "**"
# (any depth). Keep them cheap so detection stays fast.
detect:
  files:
{detect_files}

# === coverage ===
# Produces an lcov.info (or compatible) report.
# Either provide an inline `command:` (recommended) OR a `script:` path that
# resolves relative to the project root (escape hatch for complex tooling).
# `report_path` is required so LiveSpec can locate the produced artifact.
# coverage:
#   command: "<runner that produces lcov.info>"
#   # script: scripts/run-coverage.sh   # alternative to `command:`
#   report_path: coverage/lcov.info
#   threshold: 0.85          # overall line coverage gate
#   patch_threshold: 0.80    # changed-lines coverage gate (per-PR)

# === snapshots ===
# Golden-file / snapshot tests. Same `command:` vs `script:` rules apply.
# `report_path` is optional for snapshots.
# snapshots:
#   command: "<snapshot test runner>"
#   # script: scripts/run-snapshots.sh

# === properties ===
# Property-based / fuzz testing. Same `command:` vs `script:` rules apply.
# properties:
#   command: "<property test runner>"
#   # script: scripts/run-properties.sh

# === mutation ===
# Mutation testing. `report_path` is read to extract the surviving-mutant ratio.
# mutation:
#   command: "<mutation test runner>"
#   # script: scripts/run-mutation.sh
#   report_path: mutation-report.json

# Reference: .specs/spec-system.md — driver capabilities and registry layout.

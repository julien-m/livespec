  typecheck: []
builtin:
  max_file_lines:
    target: 400
    limit: 500
  max_function_lines:
    target: 30
    limit: 60
  file_header:
    swift: ^//\n//  [^\n]+\.swift
    python: null
  doc_coverage:
    require_public_api: true
  token_scale:
    scale:
    - 2
    - 4
    - 8
    - 12
    - 16
    - 24
    - 32
    - 40
    - 48
    - 64
    - 80
    properties:
    - padding
    - margin
    - spacing
  suppression_directives:
    budget: 0
    whitelist: []
  import_rules: []
coverage:
  python: full
exclusions:
- .specs/**
- .git/**
- .mimocode/**
- .mypy_cache/**
- .pytest_cache/**
- .ruff_cache/**
- .venv/**
- build/**
- coverage/**
- dist/**
- node_modules/**
- playwright-report/**
- '**/__pycache__/**'
- '**/Generated/**'
- '**/node_modules/**'
scope: repo
